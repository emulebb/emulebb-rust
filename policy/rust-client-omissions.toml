[[omissions]]
id = "sx1-live-source-exchange"
area = "ed2k"
stock_behavior = "Legacy clients may advertise and use Source Exchange v1 live request (OP_REQUESTSOURCES) and answer (OP_ANSWERSOURCES) opcodes."
rust_behavior = "The Rust client is SX2-only on every live source-exchange leg: it never sends OP_REQUESTSOURCES (download startup + multipacket request request only SX2 OP_REQUESTSOURCES2, with no SX1 fallback even for an SX1-only peer), never answers an inbound OP_REQUESTSOURCES with OP_ANSWERSOURCES (the standalone + both multipacket serve paths decode-and-ignore SX1), and does not ingest an inbound OP_ANSWERSOURCES (it is decoded for the diagnostic dump only and its sources are dropped). SX2 (OP_REQUESTSOURCES2 / OP_ANSWERSOURCES2) request, serve, and ingest stay fully active. The SX1 wire encoders/decoders remain only for codec round-trip tests."
reason = "Workspace policy records SX1 live source exchange as intentionally removed deprecated behavior; eMuleBB is SX2-only (operator decision REF-002)."
compatibility = "Stock-compatible for the supported surface because unsupported SX1 is not advertised or acted on; an SX1-only peer simply yields no exchanged sources, and an unsolicited SX1 answer is ignored."
disposition = "protocol_drop_approved"
owner = "operator"
target = "rust-v0.1.0-beta.1"
beta_blocker = false
review_disposition = "permanent-drop"
review_disposition_note = "RUST-CI-002 A4 beta freeze (2026-09-30): standing REF-002 decision; live source exchange remains SX2-only, both SX1 capability fields are zero, and SX1 packets are not acted on. PERMANENT DROP."

[[omissions]]
id = "conn-rate-rolling-five-second-window"
area = "ed2k"
stock_behavior = "eMule's connection-rate limiter (CListenSocket::TooManySockets, ListenSocket.cpp:2652-2654) compares a per-Process-tick accumulator m_OpenSocketsInterval against GetMaxConperFive(), and the accumulator is reset by CListenSocket::Process roughly once per second so the 'per five seconds' budget is enforced as a series of short per-tick batches rather than a true sliding window."
rust_behavior = "The Rust shared download coordinator instead enforces the new-connection rate as a conservative rolling 5-second sliding window (download_coordinator.rs recent_connection_grants: a grant is counted for a full DEFAULT_CONNECTION_WINDOW=5s and only then ages out), so at most GetMaxConperFive() new outgoing connections are admitted in ANY 5s span. The concurrent cap (GetMaxConnections), the per-5s rate value, and the half-open cap (GetMaxHalfConnections, default 50) are all matched; only the rate-window MODEL is the conservative sliding variant rather than eMule's per-tick reset."
reason = "Deliberate divergence (operator decision option B, connection-management safe subset): a VPN'd headless client must be gentle and avoid connection-rate bans, and a true rolling window can never burst above the per-5s budget the way eMule's per-tick batches can. The conservative window is strictly less aggressive than the master."
compatibility = "Does not affect eD2K or Kad wire compatibility; it only makes outbound connection pacing equal-or-gentler than the master. A peer/server sees the same protocol, just never a per-tick burst."
disposition = "protocol_defer"
owner = "core-protocol"
target = "post-beta polish"
beta_blocker = false
review_disposition = "defer"
review_disposition_note = "RUST-PAR-019 round-19 re-audit (2026-07-08): CONFIRMED accurate - rust holds grants a full 5s then ages out (download_coordinator.rs), strictly gentler than stock's per-tick reset (ListenSocket.cpp:2530/2649). No protocol surface. DEFER."

[[omissions]]
id = "ipv6-ed2k-kad"
area = "ed2k-kad"
stock_behavior = "Some modern clients may have protocol-adjacent IPv6 connectivity support."
rust_behavior = "The Rust client is IPv4-only for eD2K, Kad, peer transfer, NAT, and bootstrap behavior."
reason = "Rust client policy chooses IPv4-only scope for this line."
compatibility = "Stock-compatible for IPv4 peers and servers; IPv6 is not advertised as supported."
disposition = "protocol_drop_approved"
owner = "operator"
target = "ipv4-only beta line"
beta_blocker = false
review_disposition = "permanent-drop"
review_disposition_note = "RUST-PAR-019 round-19 re-audit (2026-07-08): CONFIRMED IPv4-only; no IPv6 capability bit is advertised on the eD2K/Kad hello (Ipv6 hits in-tree are incidental SocketAddr/UPnP types), so nothing is advertised-but-unimplemented. Standing IPv4-only operator direction. PERMANENT DROP."

[[omissions]]
id = "peer-chat-messaging"
area = "ed2k"
stock_behavior = "Classic eMule supports interactive peer-to-peer text chat/messaging (OP_MESSAGE) and a chat window."
rust_behavior = "The Rust client does not send or surface peer chat/messages and has no interactive captcha state. CT_EMULE_MISCOPTIONS2 bit 11 is therefore cleared. Unsolicited OP_MESSAGE and captcha packets are bounded, decoded, and ignored without disrupting the peer session."
reason = "Chat is an interactive UI feature with no eMuleBB /api/v1 surface. Advertising captcha support without a way for the user to see and answer its image challenge is a false capability contract, so the headless client explicitly declines it."
compatibility = "Does not affect file-transfer or Kad interoperability. Peers see captcha unsupported and do not initiate that optional chat challenge; unsolicited chat/captcha traffic remains tolerated. The optional bit differs from stock's hardcoded value but is semantically honest."
disposition = "protocol_drop_approved"
owner = "operator"
target = "headless no-peer-chat product scope"
beta_blocker = false
review_disposition = "permanent-drop"
review_disposition_note = "RUST-CI-002 roadmap closure (2026-09-27): resolved the advertised-but-unimplemented capability mismatch by clearing CT_EMULE_MISCOPTIONS2 bit 11. Peer chat/captcha remains outside the headless REST product scope; bounded unsolicited packets are still tolerated. PERMANENT DROP."

[[omissions]]
id = "ed2k-preview"
area = "ed2k"
stock_behavior = "Classic eMule can request a media preview from a peer (OP_REQUESTPREVIEW) and answer one (OP_PREVIEWANSWER) by extracting and sending a few decoded video/image frames, viewed in the UI."
rust_behavior = "The Rust client decodes and logs inbound OP_REQUESTPREVIEW / OP_PREVIEWANSWER for diagnostics but never generates a preview answer and never requests previews; there is no frame-extraction or preview surface."
reason = "Preview is a rarely-used interactive media feature: answering it needs a heavy media frame-extraction dependency and opens an untrusted-media decode surface, with no eMuleBB /api/v1 route to drive or expose it. Deliberately omitted (operator decision 2026-06-15); it is not advertised as required."
compatibility = "Does not affect eD2K or Kad wire compatibility; an unanswered preview request simply yields no preview, exactly as a stock peer that has the feature disabled."
disposition = "protocol_drop_approved"
owner = "operator"
target = "no media decode surface"
beta_blocker = false
review_disposition = "permanent-drop"
review_disposition_note = "RUST-REF-004 beta disposition (2026-07-13): permanent drop approved. Rust does not advertise peer media-preview support, carries no local preview REST operation, and should not add an untrusted media-decoding surface for beta. OP_REQUESTPREVIEW/PREVIEWANSWER remain decode-and-dump diagnostics only; wire behavior is equivalent to preview-disabled stock clients."

[[omissions]]
id = "kad-flood-lan-exemption"
area = "kad"
stock_behavior = "eMule's inbound Kad packet flood tracker exempts LAN/loopback source IPs from the per-(IP,opcode) token-bucket limiter and ban ONLY when the node is running in LAN mode (`if (CKademlia::IsRunningInLANMode() && IsLANIP(uIP)) return 0;`, PacketTracking.cpp:199)."
rust_behavior = "The Rust inbound flood tracker exempts all LAN/loopback source IPs unconditionally (`flood_exempt = is_lan_ip(from.ip())`, receive_loop.rs), regardless of LAN-mode, so a flooding LAN peer is never throttled or banned by the flood tracker."
reason = "Deliberate be-gentle simplification: a public VPN'd node (the release posture) essentially never receives Kad traffic from LAN peers, and unconditionally trusting LAN sources avoids a LAN-mode state dependency in the hot receive path. Strictly gentler than stock (it only ever exempts more, never bans more)."
compatibility = "Does not affect eD2K or Kad wire compatibility; the exemption only relaxes local flood defense against LAN sources, which are absent on a public node. Non-LAN (public) sources are throttled/banned exactly as stock."
disposition = "protocol_drop_approved"
owner = "operator"
target = "public VPN deployment posture"
beta_blocker = false
review_disposition = "permanent-drop"
review_disposition_note = "RUST-PAR-018 round-18 LowID-lane re-audit (2026-07-08): confirmed. Implementing the oracle's LAN-mode-only conditional (PacketTracking.cpp:199) would require introducing a LAN-mode concept solely to REDUCE leniency toward LAN sources that do not exist in the VPN'd public deployment. No wire effect on public peers; strictly gentler local defense. PERMANENT DROP - added to excluded_surface_ids in rust-client.toml."
