# Intentional Rust protocol extensions relative to stock/community eMule.
#
# This registry is distinct from rust-client-omissions.toml: entries here add
# optional behavior while retaining stock interoperability. Every entry must
# name its negotiation/fallback contract and durable backlog disposition.

[[extensions]]
id = "offerfiles-v1"
area = "ed2k-server"
tracking_item = "RUST-REF-015"
evidence_item = "RUST-CI-005"
wire_surface = "OP_LOGINREQUEST named offerfiles_v=1 tag and OP_SERVERIDENT offerfiles_v/offerfiles_batch_max/offerfiles_min_interval_ms tags"
purpose = "Negotiate bounded incremental OP_OFFERFILES batch size and minimum interval for very large shared libraries."
default_policy = "enabled by default"
advertisement_policy = "Only the long-lived publishing server session advertises the extension; one-shot keyword, source, and callback sessions retain the stock four-tag login."
stock_fallback = "Stock servers ignore the unknown login tag. A missing, partial, duplicated, wrongly typed, malformed, or timed-out first post-login advertisement selects stock-shaped legacy publication on the same connection. A complete valid first snapshot remains authoritative for that connection; reconnect starts a fresh negotiation."
compatibility = "All OP_OFFERFILES payload entries remain stock-shaped; the extension changes only optional capability negotiation and pacing."
client_gate = "RUST-BUG-141 and RUST-CI-006 must prove valid, absent, partial, wrongly typed, malformed, duplicate, late, reconnect-reset, same-connection legacy fallback, stock eMule, current-aMule, and 100000-file scale behavior before Beta 3 certification."
owner = "operator"
introduced = "2026-10-12"
reviewed = "2026-10-30"

[[extensions]]
id = "kad-find-value-more-auto"
area = "kad-search"
tracking_item = "RUST-FEAT-055"
evidence_item = "RUST-CI-006"
wire_surface = "stock KADEMLIA2_REQ with KADEMLIA_FIND_VALUE_MORE contact count"
purpose = "Automatically exhaust the bounded wider-contact action for user-facing keyword, source, and notes searches in the headless client."
default_policy = "enabled by default for user-facing Kad value searches; maintenance, publish, node, buddy, and recovery traversals remain recovery-only"
advertisement_policy = "No capability advertisement is added; the extension uses the stock request shape only with peers already eligible for a normal value lookup."
stock_fallback = "Peers answer or ignore the stock-shaped request normally. The client reasks at most four distinct responders and otherwise completes with the ordinary search results."
compatibility = "No packet, opcode, tag, identity, or response shape changes; only the bounded local decision to request additional stock-compatible contacts differs from stock eMule."
client_gate = "RUST-FEAT-055 and RUST-CI-006 must prove the four-reask ceiling, distinct-peer selection, shared concurrency limit, deadline, cancellation, correlation, deduplication, diagnostics, stock packet shape, and current-aMule comparison before Beta 3 certification."
owner = "operator"
introduced = "2026-10-30"
reviewed = "2026-10-30"
