[[resolved_omissions]]
id = "upload-duplicate-queued-intra-packet"
area = "ed2k"
stock_behavior = "eMule keeps accepted upload request keys in m_BlockRequests_keys while its disk-I/O queue owns them, so a duplicate in the same or immediately following OP_REQUESTPARTS packet is classified as upload_duplicate_queued_block_rejected; after dequeue it is classified against m_DoneBlocks_keys instead."
rust_behavior = "IMPLEMENTED: every upload slot now retains accepted range keys with their request-packet generation. Duplicates in the current or immediately preceding generation return DuplicateQueued and emit upload_duplicate_queued_block_rejected; once that pending generation drains, the served-range history returns DuplicateDone. The state is cleared on file switch and slot recycle."
reason = "A one-generation pending-key bridge preserves the oracle's asynchronous disk-queue classification across packet boundaries while retaining Rust's bounded synchronous payload serving model."
compatibility = "Duplicate requests remain rejected without changing wire behavior. Diagnostic labels now distinguish queued from completed duplicates across packets like the maintained fork."
disposition = "fixed"
owner = "transfer-runtime"
target = "implemented"
beta_blocker = false
review_disposition = "fix"
review_disposition_note = "2026-09-27: added per-slot request generations, persistent bounded queued-range keys, runtime admission classification, and focused same-packet/cross-packet/drained/file-switch tests. No longer an active omission."

[[resolved_omissions]]
id = "full-a4af-source-set-connection-hijacking"
area = "ed2k"
stock_behavior = "eMule keeps a peer-centric set of requested and no-needed files, selects the best other wanted file in CUpDownClient::SwapToAnotherFile, and reuses an already-connected peer socket for the next file request instead of opening a duplicate connection. NNP and FNF remain attributed to the relation that produced them."
rust_behavior = "IMPLEMENTED: the peer registry maintains and orders every live cross-file relation; each leased outbound peer connection receives that ordered file plan and negotiates subsequent files on the same TCP transport after completion, NNP, or FNF. Pending LowID server/Kad callback intents are likewise claimed as one peer-centric set and traversed on the single inbound connect-back. The connection-scoped hello capability, secure-ident, UDP, LowID, and buddy profile survives each file reset, while availability, hashset, queue, and request-window state is recreated per file. The shared outbound scheduler returns per-file outcomes so core applies NNP holds and FNF dead-listing to the correct relation and re-drives completed or incomplete alternate manifests."
reason = "The former A4AF-lite path only biased later source selection and re-queued another attempt. Carrying an ordered file plan through one live transport closes the deferred source-set/connection-hijacking boundary without duplicating peer connections."
compatibility = "The reused transport sends the same capability-gated stock file-startup packets as an ordinary session. A wire-level test accepts exactly one TCP connection and observes two distinct requested hashes, while scheduler coverage proves alternate FNF attribution remains isolated from the primary file."
disposition = "fixed"
owner = "transfer-runtime"
target = "implemented"
beta_blocker = false
review_disposition = "fix"
review_disposition_note = "2026-09-27: implemented full outbound and LowID connect-back A4AF connection reuse with connection-profile preservation, ordered source-set traversal, per-file outcomes, NNP/FNF lifecycle handling, and focused wire/core tests. No longer deferred."

[[resolved_omissions]]
id = "upload-throttle-focus-slot-distribution"
area = "ed2k"
stock_behavior = "The maintained eMuleBB fork distributes upload bandwidth equally across active slots and uses a 2600-byte socket-send granularity at or above 6 KiB/s and 536 bytes below 6 KiB/s (`UploadBandwidthThrottler.cpp`, `doubleSendSize`)."
rust_behavior = "IMPLEMENTED: Rust retains its shared FIFO equal-share token bucket and now divides each rate-limited encoded upload packet into the same 2600/536-byte transport chunks. Each chunk independently reserves the shared upload budget before it is written. Unlimited uploads retain the efficient whole-packet write."
reason = "The only remaining fork-specific pacing difference was rate-limited send burst size; chunking the TCP byte stream closes it without changing ED2K packet framing."
compatibility = "Encoded ED2K packet bytes and order are unchanged. Rate-limited peers now observe the maintained fork's smoother socket-send cadence at both sides of the 6 KiB/s threshold."
disposition = "fixed"
owner = "transfer-runtime"
target = "implemented"
beta_blocker = false
review_disposition = "fix"
review_disposition_note = "2026-09-27: implemented per-chunk token reservations and TCP writes with focused below-threshold, boundary, short-packet, and unlimited-path tests. No longer an active omission."

[[resolved_omissions]]
id = "server-obfuscation-metadata-non-config"
area = "ed2k"
stock_behavior = "eMule imports and persists each server's UDP flags, obfuscated TCP/UDP ports, UDP key, and the public IP to which that key is bound. Extended OP_GLOBSERVSTATRES replies and crypt-ping probes refresh that state, and a public-IP change invalidates a stale key before keyed UDP traffic is sent."
rust_behavior = "IMPLEMENTED: the Rust client decodes the full extended OP_GLOBSERVSTATRES tuple, binds learned UDP keys to the current public client ID, persists the key/key-IP and obfuscated TCP/UDP ports in profile metadata, hydrates configured and discovered server entries from that state, and suppresses a key whose binding no longer matches the current public IP. When no current key is available it sends the stock raw crypt-ping to base-port + 12, accepts the encrypted reply with the temporary challenge key, and falls back to a plaintext status request after the stock 20-second discovery timeout."
reason = "The server runtime, core state, and schema-v19 persistence pipeline now carry the complete tuple atomically, closing the prior discovery and lifecycle gap."
compatibility = "Discovered and imported servers can learn the stock keyed UDP endpoint metadata; current keys drive obfuscated UDP traffic, stale keys are never reused after a public-IP change, and metadata-poor plaintext servers retain the bounded fallback path."
disposition = "fixed"
owner = "server-runtime"
target = "implemented"
beta_blocker = false
review_disposition = "fix"
review_disposition_note = "2026-09-27: implemented extended-status decoding, crypt-ping discovery and temporary-key decryption, 20-second plaintext fallback, key/IP validity gating, schema-v19 persistence, restart hydration, and focused protocol/core/metadata tests. No longer an active omission."

[[resolved_omissions]]
id = "conn-rate-spike-modifier"
area = "ed2k"
stock_behavior = "eMule scales the per-5s new-connection budget by GetMaxConperFiveModifier() (CListenSocket::TooManySockets / GetMaxConperFiveModifier, ListenSocket.cpp:2653,2722-2728). The modifier is a SUPPRESSOR, not a raiser: it returns a multiplier in [0,1) computed from the recent open-socket spike ((SpikeSize > SpikeTolerance) ? 0 : 1 - SpikeSize/SpikeTolerance), so during a connection spike stock throttles its effective per-5s budget BELOW GetMaxConperFive() (down to 0), then relaxes back to the flat budget as the spike subsides."
rust_behavior = "IMPLEMENTED (RUST-PAR-026): the Rust download coordinator samples its live connection count once per second, maintains MFC's capped moving average, and applies GetMaxConperFiveModifier's [0,1) spike suppressor to the five-second admission window with the same strict-greater-than boundary."
reason = "RUST-PAR-026 closed the only connection-pacing axis where Rust could be more aggressive than MFC during a sudden socket burst."
compatibility = "No packet shape changed; connection admission pacing now matches MFC's adaptive suppressor."
disposition = "fixed"
owner = "core-protocol"
target = "implemented"
beta_blocker = false
review_disposition = "fix"
review_disposition_note = "RUST-PAR-026 (2026-07-10): IMPLEMENTED in download_coordinator.rs with focused burst and zero-modifier boundary tests. No longer an omission; retained as audit history."

