name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  EMULEBB_BUILD_REF: 1a462f658be63fcdab168ca42307a4b27b89959b
  EMULEBB_BUILD_TESTS_REF: a37c775b383cacda5aa4269778d865b9430d684b
  EMULEBB_TOOLING_REF: 630d1a3492ae65acad0a8dfd1575d671ff7b492c
  # Pin the native NAT sources linked by the sys crates.
  MINIUPNP_REF: 4e7a10948004ca2085ac8103e14fc77edb898b4c
  PCPNATPMP_REF: a6e787f837e507336a8774522c33b54264ef4a4b

jobs:
  single-active-pr:
    name: Single active PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Enforce one human pull request per author
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            if (pullRequest.user.type === "Bot") {
              core.info(`Bot-authored pull request #${pullRequest.number} is exempt.`);
              return;
            }

            const exceptionLabel = "parallel-approved";
            const hasException = (candidate) =>
              candidate.labels.some((label) => label.name === exceptionLabel);
            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: pullRequest.base.ref,
              per_page: 100,
            });
            const parallelPullRequests = openPullRequests.filter(
              (candidate) =>
                candidate.number !== pullRequest.number &&
                candidate.user.login === pullRequest.user.login &&
                candidate.user.type !== "Bot",
            );

            if (parallelPullRequests.length === 0) {
              core.info(`Pull request #${pullRequest.number} is the author's only open pull request.`);
              return;
            }

            const unapprovedPullRequests = [pullRequest, ...parallelPullRequests].filter(
              (candidate) => !hasException(candidate),
            );
            if (unapprovedPullRequests.length === 0) {
              core.notice(
                `Parallel work is approved on every open pull request by ${pullRequest.user.login}.`,
              );
              return;
            }

            const parallelSummary = parallelPullRequests
              .map((candidate) => `#${candidate.number} (${candidate.html_url})`)
              .join(", ");
            core.setFailed(
              `@${pullRequest.user.login} already has open pull request(s): ${parallelSummary}. ` +
                `Close or merge them before continuing, or apply '${exceptionLabel}' to every ` +
                "affected pull request after recording the maintainer-approved reason on each one.",
            );

      - name: Skip pull request policy outside pull requests
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "The single-active-PR policy applies only to pull requests."

  workflow-lint:
    name: GitHub Actions workflow lint
    needs: single-active-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout emulebb-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Validate GitHub Actions workflows
        env:
          EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
        run: python tools/rust_quality_gate.py workflow-lint

      - name: Retain CI diagnostics and build inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/reports/rust-quality-gate/
            ${{ runner.temp }}/emulebb-rust-out/reports/ci-environment/
            ${{ runner.temp }}/emulebb-rust-out/reports/webui-stage/
          if-no-files-found: warn
          retention-days: 14

  build-linux:
    name: build+test (ubuntu-24.04)
    needs: [single-active-pr, workflow-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout emulebb-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout emulebb-miniupnp (native C source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-miniupnp
          ref: ${{ env.MINIUPNP_REF }}
          path: .ci/emulebb-miniupnp

      - name: Checkout emulebb-libpcpnatpmp (native C source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-libpcpnatpmp
          ref: ${{ env.PCPNATPMP_REF }}
          path: .ci/emulebb-libpcpnatpmp

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global npm@11.20.0

      - name: Install Linux UI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libfontconfig1-dev

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target

      - name: Rust build/test gate
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
          MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
          PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
        run: python tools/rust_quality_gate.py ci-test

      - name: Retain tested beta build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/emulebb-rust-out/tools/emulebb-rust/bin/
            !${{ runner.temp }}/emulebb-rust-out/tools/emulebb-rust/bin/*.pdb
          if-no-files-found: error
          retention-days: 14

      - name: Retain CI diagnostics and build inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/reports/rust-quality-gate/
            ${{ runner.temp }}/emulebb-rust-out/reports/ci-environment/
            ${{ runner.temp }}/emulebb-rust-out/reports/webui-stage/
          if-no-files-found: warn
          retention-days: 14

  build-test:
    name: build+test (${{ matrix.runner }})
    needs: [single-active-pr, workflow-lint]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-15]
    steps:
      - name: Checkout emulebb-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout emulebb-miniupnp (native C source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-miniupnp
          ref: ${{ env.MINIUPNP_REF }}
          path: .ci/emulebb-miniupnp

      - name: Checkout emulebb-libpcpnatpmp (native C source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-libpcpnatpmp
          ref: ${{ env.PCPNATPMP_REF }}
          path: .ci/emulebb-libpcpnatpmp

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global npm@11.20.0

      - name: Install Linux UI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libfontconfig1-dev

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target

      - name: Rust build/test gate
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
          MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
          PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
        run: python tools/rust_quality_gate.py ci-test

      - name: Retain tested beta build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/emulebb-rust-out/tools/emulebb-rust/bin/
            !${{ runner.temp }}/emulebb-rust-out/tools/emulebb-rust/bin/*.pdb
          if-no-files-found: error
          retention-days: 14

      - name: Retain CI diagnostics and build inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/reports/rust-quality-gate/
            ${{ runner.temp }}/emulebb-rust-out/reports/ci-environment/
            ${{ runner.temp }}/emulebb-rust-out/reports/webui-stage/
          if-no-files-found: warn
          retention-days: 14

  build-musl:
    name: build+test (musl-${{ matrix.architecture }})
    needs: [single-active-pr, workflow-lint]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {architecture: amd64, runner: ubuntu-24.04}
          - {architecture: arm64, runner: ubuntu-24.04-arm}
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
      EMULEBB_RUST_REPO: ${{ github.workspace }}
      EMULEBB_TOOLING_REPO: ${{ github.workspace }}/.ci/emulebb-tooling
      EMULEBB_BUILD_TESTS_REPO: ${{ github.workspace }}/.ci/emulebb-build-tests
      MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
      PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
    steps:
      - name: Checkout emulebb-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned build orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-build
          ref: ${{ env.EMULEBB_BUILD_REF }}
          path: .ci/emulebb-build
      - name: Checkout pinned lifecycle harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-build-tests
          ref: ${{ env.EMULEBB_BUILD_TESTS_REF }}
          path: .ci/emulebb-build-tests
      - name: Checkout pinned product documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-tooling
          ref: ${{ env.EMULEBB_TOOLING_REF }}
          path: .ci/emulebb-tooling
      - name: Checkout pinned MiniUPnP source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-miniupnp
          ref: ${{ env.MINIUPNP_REF }}
          path: .ci/emulebb-miniupnp
      - name: Checkout pinned PCP/NAT-PMP source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-libpcpnatpmp
          ref: ${{ env.PCPNATPMP_REF }}
          path: .ci/emulebb-libpcpnatpmp
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt, clippy
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@11.20.0
      - name: Install pinned workspace CLI dependencies
        run: python -m pip install click==8.4.1 pydantic==2.14.3
      - name: Set up pinned Docker
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.6.1
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Set up pinned Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.35.0
          driver: docker
          use: false
      - name: Read the candidate version
        run: python -c 'import tomllib; from pathlib import Path; print("RELEASE_VERSION=" + tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"])' >> "$GITHUB_ENV"
      - name: Build, lint and test native musl with the local recipe
        working-directory: .ci/emulebb-build
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
        run: python -B -m emule_workspace package-emulebb-rust-linux-ci --libc musl --architecture ${{ matrix.architecture }} --release-version "$RELEASE_VERSION" --test-scope full --smoke
      - name: Retain tested musl package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-musl-${{ matrix.architecture }}-${{ github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/emulebb-rust-out/packages/rust-linux/*/musl-${{ matrix.architecture }}/*.tar.zst
            ${{ runner.temp }}/emulebb-rust-out/packages/rust-linux/*/musl-${{ matrix.architecture }}/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain musl diagnostics and runtime proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-musl-${{ matrix.architecture }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/emulebb-rust-out/reports/rust-linux/
          if-no-files-found: warn
          retention-days: 14

  rest-openapi:
    name: live REST/OpenAPI conformance
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout emulebb-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repos/emulebb-rust

      - name: Checkout pinned live conformance harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-build-tests
          ref: a37c775b383cacda5aa4269778d865b9430d684b
          path: repos/emulebb-build-tests

      - name: Checkout pinned Rust OpenAPI contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-tooling
          ref: 630d1a3492ae65acad0a8dfd1575d671ff7b492c
          path: repos/emulebb-tooling

      - name: Download tested Linux daemon
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emulebb-rust-Linux-X64-${{ github.sha }}
          path: ${{ runner.temp }}/emulebb-rust-out/tools/emulebb-rust/bin

      - name: Restore daemon execute permission
        run: chmod +x "${{ runner.temp }}/emulebb-rust-out/tools/emulebb-rust/bin/emulebb-rust"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install live conformance dependencies
        run: python -m pip install -r repos/emulebb-rust/tools/requirements-ci.txt

      - name: Gate live REST responses against OpenAPI
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
        run: python repos/emulebb-rust/tools/rust_quality_gate.py rest-openapi

      - name: Retain live REST/OpenAPI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-rest-openapi-${{ github.sha }}
          path: ${{ runner.temp }}/emulebb-rust-out/reports/rust-rest-openapi-ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain CI diagnostics and build inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/reports/rust-quality-gate/
            ${{ runner.temp }}/emulebb-rust-out/reports/ci-environment/
            ${{ runner.temp }}/emulebb-rust-out/reports/webui-stage/
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: policy + format + WebUI
    needs: [single-active-pr, workflow-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout emulebb-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The environment gate inventories the same pinned native inputs as the
      # target build jobs.
      - name: Checkout emulebb-miniupnp (native C source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-miniupnp
          ref: ${{ env.MINIUPNP_REF }}
          path: .ci/emulebb-miniupnp

      - name: Checkout emulebb-libpcpnatpmp (native C source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-libpcpnatpmp
          ref: ${{ env.PCPNATPMP_REF }}
          path: .ci/emulebb-libpcpnatpmp

      - name: Install pinned Rust with rustfmt and Clippy
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global npm@11.20.0

      - name: Install Linux UI build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libfontconfig1-dev

      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Install CI test dependencies
        run: python -m pip install -r tools/requirements-ci.txt

      - name: Rust quality gate
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
          MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
          PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
        run: python tools/rust_quality_gate.py ci-quality

      - name: Retain CI diagnostics and build inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/reports/rust-quality-gate/
            ${{ runner.temp }}/emulebb-rust-out/reports/ci-environment/
            ${{ runner.temp }}/emulebb-rust-out/reports/webui-stage/
          if-no-files-found: warn
          retention-days: 14

  supply-chain:
    name: cargo-deny (advisories, licenses, sources)
    needs: single-active-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout emulebb-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: Check advisories, licenses, and sources
        env:
          EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
        run: python tools/rust_quality_gate.py supply-chain

      - name: Retain CI diagnostics and build inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/reports/rust-quality-gate/
            ${{ runner.temp }}/emulebb-rust-out/reports/ci-environment/
            ${{ runner.temp }}/emulebb-rust-out/reports/webui-stage/
          if-no-files-found: warn
          retention-days: 14

  required-ci:
    name: Required CI
    if: ${{ always() }}
    needs: [single-active-pr, workflow-lint, build-linux, build-test, build-musl, rest-openapi, quality, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job
        shell: bash
        env:
          SINGLE_ACTIVE_PR_RESULT: ${{ needs.single-active-pr.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          BUILD_LINUX_RESULT: ${{ needs.build-linux.result }}
          BUILD_TEST_RESULT: ${{ needs.build-test.result }}
          BUILD_MUSL_RESULT: ${{ needs.build-musl.result }}
          REST_OPENAPI_RESULT: ${{ needs.rest-openapi.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain.result }}
        run: |
          set -euo pipefail
          for result in \
            "$SINGLE_ACTIVE_PR_RESULT" \
            "$WORKFLOW_LINT_RESULT" \
            "$BUILD_LINUX_RESULT" \
            "$BUILD_TEST_RESULT" \
            "$BUILD_MUSL_RESULT" \
            "$REST_OPENAPI_RESULT" \
            "$QUALITY_RESULT" \
            "$SUPPLY_CHAIN_RESULT"; do
            test "$result" = success
          done
