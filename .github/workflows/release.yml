name: Release

# Manual runs retain candidate artifacts. Approved tags and the reusable nightly
# caller may publish the verified result.
on:
  push:
    tags: ["rust-v*"]
  workflow_dispatch:
    inputs:
      platform_profile:
        description: "Required target inventory; reduced profile is unpublished candidate-only"
        type: choice
        options: [full, windows-linux]
        default: full
      ref:
        description: "Optional exact source SHA assertion; must match the selected workflow revision"
        required: false
  workflow_call:
    inputs:
      platform_profile:
        description: "Full publication remains the default platform contract"
        type: string
        default: full
      release_version:
        description: "Distribution version assigned to the packages and release"
        required: true
        type: string
      source_ref:
        description: "Immutable Rust source assertion; must match the caller workflow revision"
        required: true
        type: string
      previous_ref:
        description: "Previous nightly tag used to generate release notes"
        required: false
        type: string
        default: ""
      channel:
        description: "Release channel (candidate or nightly)"
        required: false
        type: string
        default: candidate
      publish:
        description: "Publish verified GitHub and GHCR assets"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_PLATFORM_PROFILE: ${{ inputs.platform_profile || 'full' }}
  RELEASE_CHANNEL: ${{ inputs.channel || (startsWith(github.ref, 'refs/tags/rust-v') && 'beta') || 'candidate' }}
  EMULEBB_BUILD_REF: 3b9ddf42466b07f852f798f6967ca782484056a4
  EMULEBB_LINUX_PREPARED_IMAGE: ghcr.io/emulebb/emulebb-build-ci/ubuntu-rust@sha256:98da7751087bc9a47a597571f99e4bebdccadb5ea80e9757d0f15452a35308bb
  EMULEBB_BUILD_TESTS_REF: 7c680ed68e478c2f22c56c65f21f12c3790d3826
  EMULEBB_TOOLING_REF: 8125e1a42dbac792eae6e35bbc427d6b885d599f
  EMULEBB_RELEASE_VALIDATOR_REF: ff4852d3ed6d4145669cb018d1287561e9983fe3
  EMULEBB_APK_BUILD_REF: ff4852d3ed6d4145669cb018d1287561e9983fe3
  EMULEBB_APK_BUILD_TESTS_REF: b87b82eb2a8c62c00d0ad507a56e15831c39d07f
  EMULEBB_ANDROID_SIGNER_SHA256: 9edc742d7230a714a0149c20eb2afb235b8ad5237166090f10e7ac69e2bb359f
  MINIUPNP_REF: 4e7a10948004ca2085ac8103e14fc77edb898b4c
  PCPNATPMP_REF: a6e787f837e507336a8774522c33b54264ef4a4b

jobs:
  prepare:
    name: Prepare release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      platform_profile: ${{ steps.profile.outputs.platform_profile }}
      native_matrix: ${{ steps.profile.outputs.native_matrix }}
      release_version: ${{ steps.identity.outputs.version }}
      source_sha: ${{ steps.source.outputs.sha }}
      apk_version_code: ${{ steps.android-code.outputs.apk_version_code }}
    steps:
      - name: Checkout trusted release-control helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Bind the platform inventory before any producer runs
        id: profile
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish || false }}
        run: >-
          python tools/release_publish.py platform-profile
          --profile "$RELEASE_PLATFORM_PROFILE" --event-name "$GITHUB_EVENT_NAME"
          --channel "$RELEASE_CHANNEL" --publish "$REQUESTED_PUBLISH"
          --github-output "$GITHUB_OUTPUT"
      # WHY: default-branch jobs must not execute an independently selected
      # checkout with access to the default branch's cache scope.
      - name: Bind source and workflow revision
        id: source
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          CANDIDATE_REF: ${{ github.event.inputs.ref }}
        run: >-
          python tools/release_publish.py workflow-source --workflow-sha "$WORKFLOW_SHA"
          --source-ref "$SOURCE_REF" --candidate-ref "$CANDIDATE_REF" --github-output "$GITHUB_OUTPUT"
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          path: .ci/candidate
          persist-credentials: false
      - name: Derive and validate release version
        id: identity
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: python tools/release_publish.py release-identity --requested-version "$REQUESTED_VERSION" --channel "$RELEASE_CHANNEL" --ref-name "$GITHUB_REF_NAME" --ref-type "$GITHUB_REF_TYPE" --github-output "$GITHUB_OUTPUT" --source-root .ci/candidate
      - name: Derive one UTC Android version code for every producer and proof
        id: android-code
        run: python tools/release_publish.py android-version-code --github-output "$GITHUB_OUTPUT"
      - name: Generate and preflight immutable-source release documents
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PREVIOUS_REF: ${{ inputs.previous_ref }}
          RELEASE_DOCS_DIR: ${{ runner.temp }}/emulebb-rust-out/release-docs
        run: >-
          python -B tools/nightly_release.py release-docs --version "$RELEASE_VERSION"
          --channel "$RELEASE_CHANNEL" --source-sha "$SOURCE_SHA"
          --source-root .ci/candidate --previous-ref "$PREVIOUS_REF" --output-dir "$RELEASE_DOCS_DIR"
      - name: Retain preflighted release documents
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-release-documents
          path: ${{ runner.temp }}/emulebb-rust-out/release-docs/*.md
          if-no-files-found: error
          retention-days: 30

  verify-source:
    name: Require green source checks
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout trusted source-check helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Verify required checks on the exact source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/nightly_release.py verify-source --sha "${{ needs.prepare.outputs.source_sha }}" --platform-profile "${{ needs.prepare.outputs.platform_profile }}"

  native-package:
    name: ${{ matrix.os }}-${{ matrix.arch }} package
    needs: [prepare, verify-source]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.native_matrix) }}
    env:
      NATIVE_PAYLOAD_PREFIX: emulebb-rust-native-payload
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
      EMULEBB_RUST_REPO: ${{ github.workspace }}
      EMULEBB_TOOLING_REPO: ${{ github.workspace }}/.ci/emulebb-tooling
      MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
      PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
    steps: &native-package-steps
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Checkout native MiniUPnP source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-miniupnp
          ref: ${{ env.MINIUPNP_REF }}
          path: .ci/emulebb-miniupnp
      - name: Checkout native libpcpnatpmp source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-libpcpnatpmp
          ref: ${{ env.PCPNATPMP_REF }}
          path: .ci/emulebb-libpcpnatpmp
      - name: Checkout pinned workspace packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-build
          ref: ${{ env.EMULEBB_BUILD_REF }}
          path: .ci/emulebb-build
      - name: Checkout pinned release documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-tooling
          ref: ${{ env.EMULEBB_TOOLING_REF }}
          path: .ci/emulebb-tooling
      - name: Install pinned Rust
        if: matrix.os != 'linux'
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install pinned workspace CLI dependencies
        run: python -m pip install -r tools/requirements-ci.txt click==8.4.1 pydantic==2.14.3
      - name: Set up Node.js
        if: matrix.os != 'linux'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false
      - name: Install pinned npm
        if: matrix.os != 'linux'
        run: npm install --global npm@11.20.0

      - name: Assert release build excludes test-only features
        run: python tools/check_rust_client_policy.py
      - name: Prepare inherited build output directory
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
        run: python -c "from pathlib import Path; import os; Path(os.environ['CARGO_TARGET_DIR']).mkdir(parents=True, exist_ok=True)"
      - name: Build and package native release asset
        if: matrix.os != 'linux'
        working-directory: .ci/emulebb-build
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
          EMULEBB_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          EMULEBB_RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          EMULEBB_SOURCE_REVISION: ${{ needs.prepare.outputs.source_sha }}
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: python -m emule_workspace package-emulebb-rust-ci --release-version ${{ env.RELEASE_VERSION }} --target-os ${{ matrix.os }} --platform ${{ matrix.arch }}
      - name: Set up pinned Docker for prepared Linux packaging
        if: matrix.os == 'linux'
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.6.1
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Build and package Linux release asset with verified prepared builder
        if: matrix.os == 'linux'
        timeout-minutes: 40
        working-directory: .ci/emulebb-build
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
          EMULEBB_RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          EMULEBB_RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
          EMULEBB_SOURCE_REVISION: ${{ needs.prepare.outputs.source_sha }}
          RUSTUP_TOOLCHAIN: "1.98.1"
          PREPARED_IMAGE: ${{ env.EMULEBB_LINUX_PREPARED_IMAGE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -B -m emule_workspace package-emulebb-rust-prepared-ci
          --image "$PREPARED_IMAGE" --release-version "$RELEASE_VERSION" --platform ${{ matrix.arch }}
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-build-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/logs/builds/**/*.log
            ${{ runner.temp }}/emulebb-rust-out/reports/prepared-native/**/execution.json
            ${{ runner.temp }}/emulebb-rust-out/reports/prepared-native/**/package.log
          if-no-files-found: warn
          retention-days: 30
      - name: Retain package and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NATIVE_PAYLOAD_PREFIX }}-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*.zip
            ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*.deb
            ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*.AppImage
            ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*.dmg
            ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*.json
          if-no-files-found: error
          retention-days: 30

  native-package-smoke:
    name: ${{ matrix.slug }} packaged lifecycle
    needs: [prepare, native-package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.native_matrix) }}
    env:
      NATIVE_PAYLOAD_PREFIX: emulebb-rust-native-payload
      PACKAGE_SMOKE_PREFIX: emulebb-rust-package-smoke
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
    steps: &native-package-smoke-steps
      - name: Checkout trusted release-control source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Checkout candidate schema as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: .ci/candidate
      - name: Checkout pinned package smoke harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-build-tests
          ref: ${{ env.EMULEBB_BUILD_TESTS_REF }}
          path: .ci/emulebb-build-tests
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install pinned rendered WebUI smoke dependency
        if: matrix.os == 'windows' && matrix.arch == 'x64'
        run: python -m pip install playwright==1.59.0 && python -m playwright install chromium
      - name: Download native package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.NATIVE_PAYLOAD_PREFIX }}-${{ matrix.slug }}
          path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
      - name: Prove packaged lifecycle, local transfer, and embedded WebUI
        env:
          EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
        run: python .ci/emulebb-build-tests/scripts/smoke-rust-release-package.py --release-dir "${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}" --release-version ${{ env.RELEASE_VERSION }} --rust-repo .ci/candidate --expected-source-sha "${{ needs.prepare.outputs.source_sha }}" --expected-channel "${{ env.RELEASE_CHANNEL }}" --report-path "${{ runner.temp }}/emulebb-rust-out/evidence/emulebb-rust-v${{ env.RELEASE_VERSION }}-package-smoke-${{ matrix.slug }}.json" --target-os ${{ matrix.os }} --platform ${{ matrix.arch }} ${{ matrix.os != 'macos' && '--verify-profile-ownership' || '' }} ${{ matrix.os == 'windows' && matrix.arch == 'x64' && '--render-webui' || '' }}
      - name: Retain package lifecycle evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.PACKAGE_SMOKE_PREFIX }}-${{ matrix.slug }}
          path: ${{ runner.temp }}/emulebb-rust-out/evidence/emulebb-rust-v${{ env.RELEASE_VERSION }}-package-smoke-${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 30

  optional-macos-package:
    if: ${{ needs.prepare.outputs.platform_profile == 'windows-linux' }}
    name: ${{ matrix.os }}-${{ matrix.arch }} package
    needs: [prepare, verify-source]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos, arch: x64, slug: macos-x64, runner: macos-15-intel}
          - {os: macos, arch: ARM64, slug: macos-arm64, runner: macos-15}
    env:
      NATIVE_PAYLOAD_PREFIX: emulebb-rust-optional-native-payload
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
      EMULEBB_RUST_REPO: ${{ github.workspace }}
      EMULEBB_TOOLING_REPO: ${{ github.workspace }}/.ci/emulebb-tooling
      MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
      PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
    steps: *native-package-steps

  optional-macos-smoke:
    if: ${{ needs.prepare.outputs.platform_profile == 'windows-linux' }}
    name: ${{ matrix.slug }} packaged lifecycle
    needs: [prepare, optional-macos-package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos, arch: x64, slug: macos-x64, runner: macos-15-intel}
          - {os: macos, arch: ARM64, slug: macos-arm64, runner: macos-15}
    env:
      NATIVE_PAYLOAD_PREFIX: emulebb-rust-optional-native-payload
      PACKAGE_SMOKE_PREFIX: emulebb-rust-optional-package-smoke
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
    steps: *native-package-smoke-steps

  optional-release-platforms:
    name: Optional release platform outcomes
    if: ${{ always() && needs.prepare.outputs.platform_profile == 'windows-linux' }}
    needs: [prepare, optional-macos-package, optional-macos-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report optional macOS package and lifecycle outcomes
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.optional-macos-package.result }}
          SMOKE_RESULT: ${{ needs.optional-macos-smoke.result }}
        run: |
          set -euo pipefail
          printf '### Optional macOS release outcomes\n\nPackage: %s\n\nLifecycle: %s\n' "$PACKAGE_RESULT" "$SMOKE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$PACKAGE_RESULT" = success
          test "$SMOKE_RESULT" = success

  musl-package:
    name: Static musl ${{ matrix.architecture }}
    needs: [prepare, verify-source]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {architecture: amd64, slug: linux-x64-musl, runner: ubuntu-24.04}
          - {architecture: arm64, slug: linux-arm64-musl, runner: ubuntu-24.04-arm}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
      EMULEBB_RUST_REPO: ${{ github.workspace }}
      EMULEBB_TOOLING_REPO: ${{ github.workspace }}/.ci/emulebb-tooling
      EMULEBB_BUILD_TESTS_REPO: ${{ github.workspace }}/.ci/emulebb-build-tests
      MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
      PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout pinned MiniUPnP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-miniupnp
          ref: ${{ env.MINIUPNP_REF }}
          path: .ci/emulebb-miniupnp
          persist-credentials: false
      - name: Checkout pinned PCP/NAT-PMP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-libpcpnatpmp
          ref: ${{ env.PCPNATPMP_REF }}
          path: .ci/emulebb-libpcpnatpmp
          persist-credentials: false
      - name: Checkout pinned workspace packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build
          ref: ${{ env.EMULEBB_BUILD_REF }}
          path: .ci/emulebb-build
          persist-credentials: false
      - name: Checkout pinned release scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-tooling
          ref: ${{ env.EMULEBB_TOOLING_REF }}
          path: .ci/emulebb-tooling
          persist-credentials: false
      - name: Checkout pinned lifecycle harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build-tests
          ref: ${{ env.EMULEBB_BUILD_TESTS_REF }}
          path: .ci/emulebb-build-tests
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install pinned workspace CLI dependencies
        run: python -m pip install click==8.4.1 pydantic==2.14.3
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@11.20.0
      - name: Set up pinned native Docker
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.6.1
      - name: Prepare inherited host Cargo target for the source-cache fence
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
        run: python -c "from pathlib import Path; import os; Path(os.environ['CARGO_TARGET_DIR']).mkdir(parents=True, exist_ok=True)"
      - name: Build, test and smoke static musl with the local recipe
        working-directory: .ci/emulebb-build
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
        run: >-
          python -B -m emule_workspace package-emulebb-rust-linux-ci
          --use-ci-image-mirrors
          --libc musl --architecture ${{ matrix.architecture }} --release-version "$RELEASE_VERSION"
          --test-scope full --smoke
          --smoke-report-path "${{ runner.temp }}/emulebb-rust-out/evidence/emulebb-rust-v${{ env.RELEASE_VERSION }}-package-smoke-${{ matrix.slug }}.json"
      - name: Retain static musl payload and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-musl-payload-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/packages/rust-linux/${{ env.RELEASE_VERSION }}/musl-${{ matrix.architecture }}/*.tar.zst
            ${{ runner.temp }}/emulebb-rust-out/packages/rust-linux/${{ env.RELEASE_VERSION }}/musl-${{ matrix.architecture }}/*.manifest.json
            ${{ runner.temp }}/emulebb-rust-out/packages/rust-linux/${{ env.RELEASE_VERSION }}/musl-${{ matrix.architecture }}/*.sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain native musl lifecycle evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-package-smoke-${{ matrix.slug }}
          path: ${{ runner.temp }}/emulebb-rust-out/evidence/emulebb-rust-v${{ env.RELEASE_VERSION }}-package-smoke-${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain musl diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-musl-build-logs-${{ matrix.architecture }}
          path: ${{ runner.temp }}/emulebb-rust-out/reports/rust-linux/**/*.log
          if-no-files-found: warn
          retention-days: 30

  android-package:
    name: Experimental Android developer bundle (${{ matrix.abi }})
    if: ${{ inputs.channel == 'nightly' }}
    needs: [prepare, verify-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
      EMULEBB_RUST_REPO: ${{ github.workspace }}
      EMULEBB_TOOLING_REPO: ${{ github.workspace }}/.ci/emulebb-tooling
      MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
      PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
    steps:
      - name: Checkout workflow-bound candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout pinned Android packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build
          ref: ${{ env.EMULEBB_BUILD_REF }}
          path: .ci/emulebb-build
          persist-credentials: false
      - name: Checkout pinned release scope
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-tooling
          ref: ${{ env.EMULEBB_TOOLING_REF }}
          path: .ci/emulebb-tooling
          persist-credentials: false
      - name: Checkout pinned MiniUPnP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-miniupnp
          ref: ${{ env.MINIUPNP_REF }}
          path: .ci/emulebb-miniupnp
          persist-credentials: false
      - name: Checkout pinned PCP/NAT-PMP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-libpcpnatpmp
          ref: ${{ env.PCPNATPMP_REF }}
          path: .ci/emulebb-libpcpnatpmp
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install pinned workspace CLI dependencies
        run: python -m pip install click==8.4.1 pydantic==2.14.3
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@11.20.0
      - name: Set up pinned Docker
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.6.1
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Set up pinned Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.35.0
          driver: docker
          use: false
      - name: Compile and package experimental Android daemon without runtime claims
        working-directory: .ci/emulebb-build
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          python -B -m emule_workspace package-rust-android-ci \
            --abi ${{ matrix.abi }} --release-version "$RELEASE_VERSION" \
            --channel nightly --expected-source-sha "$EXPECTED_SOURCE_SHA"
      - name: Retain experimental developer payload and compile-only evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-android-developer-payload-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/packages/rust-android/${{ env.RELEASE_VERSION }}/${{ matrix.abi }}/*.tar.zst
            ${{ runner.temp }}/emulebb-rust-out/packages/rust-android/${{ env.RELEASE_VERSION }}/${{ matrix.abi }}/*.manifest.json
            ${{ runner.temp }}/emulebb-rust-out/packages/rust-android/${{ env.RELEASE_VERSION }}/${{ matrix.abi }}/*.sbom.spdx.json
            ${{ runner.temp }}/emulebb-rust-out/packages/rust-android/${{ env.RELEASE_VERSION }}/${{ matrix.abi }}/*-compile-elf.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain Android compilation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-android-build-logs-${{ matrix.abi }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/reports/android-toolchain/
            ${{ runner.temp }}/emulebb-rust-out/reports/rust-android/
          if-no-files-found: warn
          retention-days: 30

  android-apk-package:
    name: Signed universal Android application
    if: ${{ inputs.channel == 'nightly' }}
    needs: [prepare, verify-source]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      manifest_sha256: ${{ steps.apk.outputs.manifest_sha256 }}
      apk_sha256: ${{ steps.apk.outputs.apk_sha256 }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      EMULEBB_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.apk_version_code }}
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
      EMULEBB_RUST_REPO: ${{ github.workspace }}
      EMULEBB_TOOLING_REPO: ${{ github.workspace }}/.ci/emulebb-tooling
      MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
      PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
    steps:
      - &apk-checkout-source
        name: Checkout workflow-bound application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - &apk-checkout-build
        name: Checkout pinned APK producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build
          ref: ${{ env.EMULEBB_APK_BUILD_REF }}
          path: .ci/emulebb-build
          persist-credentials: false
      - &apk-checkout-tooling
        name: Checkout pinned APK contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-tooling
          ref: ${{ env.EMULEBB_TOOLING_REF }}
          path: .ci/emulebb-tooling
          persist-credentials: false
      - &apk-checkout-miniupnp
        name: Checkout pinned APK MiniUPnP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-miniupnp
          ref: ${{ env.MINIUPNP_REF }}
          path: .ci/emulebb-miniupnp
          persist-credentials: false
      - &apk-checkout-pcp
        name: Checkout pinned APK PCP/NAT-PMP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-libpcpnatpmp
          ref: ${{ env.PCPNATPMP_REF }}
          path: .ci/emulebb-libpcpnatpmp
          persist-credentials: false
      - &apk-python
        name: Set up pinned APK Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - &apk-python-dependencies
        name: Install pinned APK owner dependencies
        run: python -m pip install click==8.4.1 pydantic==2.14.3
      - name: Set up pinned APK Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false
      - name: Install pinned APK npm
        run: npm install --global npm@11.20.0
      - &apk-docker
        name: Set up pinned APK Docker
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.6.1
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - &apk-buildx
        name: Set up pinned APK Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.35.0
          driver: docker
          use: false
      - name: Build and verify one production-signed APK
        id: apk
        working-directory: .ci/emulebb-build
        env:
          EMULEBB_ANDROID_KEYSTORE_BASE64: ${{ secrets.EMULEBB_ANDROID_KEYSTORE_BASE64 }}
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
          EMULEBB_ANDROID_KEY_ALIAS: ${{ secrets.EMULEBB_ANDROID_KEY_ALIAS }}
          EMULEBB_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EMULEBB_ANDROID_KEYSTORE_PASSWORD }}
          EMULEBB_ANDROID_KEY_PASSWORD: ${{ secrets.EMULEBB_ANDROID_KEY_PASSWORD }}
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/emulebb-android-signing.XXXXXX")"
          trap 'rm -f -- "$signing_dir/release.keystore"; rmdir -- "$signing_dir"' EXIT
          printf '%s' "$EMULEBB_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.keystore"
          export EMULEBB_ANDROID_KEYSTORE="$signing_dir/release.keystore"
          unset EMULEBB_ANDROID_KEYSTORE_BASE64
          mkdir -p "$CARGO_TARGET_DIR"
          python -B -m emule_workspace package-rust-android-apk-ci \
            --release-version "$RELEASE_VERSION" --channel nightly --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-cert-sha256 "$EMULEBB_ANDROID_SIGNER_SHA256" --version-code "$EMULEBB_ANDROID_VERSION_CODE" \
            --github-output "$GITHUB_OUTPUT"
      - name: Retain exact signed APK payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-android-apk-payload
          path: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ steps.apk.outputs.manifest_path }}
            ${{ steps.apk.outputs.sbom_path }}
          if-no-files-found: error
          retention-days: 30

  android-apk-qualification:
    name: Android application runtime (${{ matrix.image }})
    if: ${{ inputs.channel == 'nightly' }}
    needs: [prepare, android-apk-package, android-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [apk34, apk35, apk36, apk37]
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      EMULEBB_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.apk_version_code }}
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
      EMULEBB_RUST_REPO: ${{ github.workspace }}
      EMULEBB_TOOLING_REPO: ${{ github.workspace }}/.ci/emulebb-tooling
      MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
      PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
      EMULEBB_TESTS_REPO: ${{ github.workspace }}/.ci/emulebb-build-tests
    steps:
      - *apk-checkout-source
      - *apk-checkout-build
      - *apk-checkout-tooling
      - *apk-checkout-miniupnp
      - *apk-checkout-pcp
      - name: Checkout pinned APK runtime Harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build-tests
          ref: ${{ env.EMULEBB_APK_BUILD_TESTS_REF }}
          path: .ci/emulebb-build-tests
          persist-credentials: false
      - *apk-python
      - *apk-python-dependencies
      - *apk-docker
      - *apk-buildx
      - name: Grant this runner access to KVM
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Download the single signed APK payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emulebb-rust-android-apk-payload
          path: ${{ runner.temp }}/emulebb-rust-out/apk-input
      - name: Download the same-source native x86_64 peer archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emulebb-rust-android-developer-payload-x86_64
          path: ${{ runner.temp }}/emulebb-rust-out/peer-input
      - name: Qualify identical APK bytes on the selected API
        id: qualify
        working-directory: .ci/emulebb-build
        env:
          APK_MANIFEST_SHA256: ${{ needs.android-apk-package.outputs.manifest_sha256 }}
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
          EXPECTED_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: >-
          python -B -m emule_workspace qualify-rust-android-apk-ci --image ${{ matrix.image }}
          --apk-payload "$EMULEBB_WORKSPACE_OUTPUT_ROOT/apk-input"
          --apk-manifest-name "emulebb-rust-v$RELEASE_VERSION-android-universal.apk.manifest.json"
          --apk-manifest-sha256 "$APK_MANIFEST_SHA256" --apk-source-sha "$EXPECTED_SOURCE_SHA"
          --expected-cert-sha256 "$EMULEBB_ANDROID_SIGNER_SHA256" --apk-version-code "$EMULEBB_ANDROID_VERSION_CODE"
          --release-version "$RELEASE_VERSION" --peer-artifacts "$EMULEBB_WORKSPACE_OUTPUT_ROOT/peer-input"
          --peer-build-ref "$EMULEBB_BUILD_REF" --apk-build-ref "$EMULEBB_APK_BUILD_REF"
          --apk-harness-ref "$EMULEBB_APK_BUILD_TESTS_REF" --soak-seconds 60 --github-output "$GITHUB_OUTPUT"
      - name: Retain sanitized API-specific proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-android-apk-proof-${{ matrix.image }}
          path: ${{ steps.qualify.outputs.qualification_path }}
          if-no-files-found: error
          retention-days: 30

  image-candidate:
    name: Build multiarch ${{ matrix.variant }} image candidate
    needs: [prepare, native-package, musl-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, alpine]
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      EMULEBB_RUST_REPO: ${{ github.workspace }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout trusted OCI control helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci/control
          persist-credentials: false
      - name: Checkout pinned workspace packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build
          ref: ${{ env.EMULEBB_BUILD_REF }}
          path: .ci/emulebb-build
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install pinned workspace CLI dependencies
        run: python -m pip install click==8.4.1 pydantic==2.14.3
      - name: Set up pinned Docker with multi-platform image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.6.1
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Set up ARM64 build emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Install pinned Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.35.0
          driver: docker
          use: false
      - name: Authenticate upstream GHCR base pulls
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download GNU Linux inputs for Ubuntu
        if: matrix.variant == 'ubuntu'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: emulebb-rust-native-payload-linux-*
          merge-multiple: true
          path: ${{ runner.temp }}/emulebb-rust-out/image-inputs
      - name: Download static musl inputs for Alpine
        if: matrix.variant == 'alpine'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: emulebb-rust-musl-payload-*
          merge-multiple: true
          path: ${{ runner.temp }}/emulebb-rust-out/image-inputs
      - name: Build provenance-bearing OCI archive without publishing
        working-directory: .ci/emulebb-build
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
        run: >-
          python -B -m emule_workspace package-emulebb-rust-image-ci
          --use-ci-image-mirrors
          --variant ${{ matrix.variant }} --release-version "$RELEASE_VERSION"
          --assets-dir "${{ runner.temp }}/emulebb-rust-out/image-inputs"
          --control-rust-repo "${{ github.workspace }}/.ci/control"
      - name: Retain exact OCI archive and build identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-image-archive-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/artifacts/emulebb-rust-v${{ env.RELEASE_VERSION }}-${{ matrix.variant }}-multiarch.oci.tar
            ${{ runner.temp }}/emulebb-rust-out/artifacts/emulebb-rust-v${{ env.RELEASE_VERSION }}-${{ matrix.variant }}-multiarch.oci.tar.manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain image build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-image-build-logs-${{ matrix.variant }}
          path: ${{ runner.temp }}/emulebb-rust-out/reports/rust-image-build/**/*.log
          if-no-files-found: warn
          retention-days: 30

  image-native-validation:
    name: Native ${{ matrix.variant }} image ${{ matrix.architecture }}
    needs: [prepare, image-candidate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [ubuntu, alpine]
        architecture: [amd64, arm64]
        include:
          - {architecture: amd64, runner: ubuntu-24.04}
          - {architecture: arm64, runner: ubuntu-24.04-arm}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      EMULEBB_RUST_REPO: ${{ github.workspace }}/.ci/candidate
      EMULEBB_BUILD_TESTS_REPO: ${{ github.workspace }}/.ci/emulebb-build-tests
    steps:
      - name: Checkout trusted OCI control helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout candidate recipe as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci/candidate
          persist-credentials: false
      - name: Checkout pinned workspace image validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build
          ref: ${{ env.EMULEBB_BUILD_REF }}
          path: .ci/emulebb-build
          persist-credentials: false
      - name: Checkout pinned image lifecycle harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build-tests
          ref: ${{ env.EMULEBB_BUILD_TESTS_REF }}
          path: .ci/emulebb-build-tests
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install pinned workspace CLI dependencies
        run: python -m pip install click==8.4.1 pydantic==2.14.3
      - name: Set up pinned native Docker with multi-platform image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.6.1
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - name: Download exact assembled OCI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emulebb-rust-image-archive-${{ matrix.variant }}
          path: ${{ runner.temp }}/emulebb-rust-out/artifacts
      - name: Prove native lifecycle, CPU-specific SPDX and fixable vulnerability gate
        working-directory: .ci/emulebb-build
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
        run: >-
          python -B -m emule_workspace validate-emulebb-rust-image-ci
          --archive "${{ runner.temp }}/emulebb-rust-out/artifacts/emulebb-rust-v${{ env.RELEASE_VERSION }}-${{ matrix.variant }}-multiarch.oci.tar"
          --image "ghcr.io/emulebb/emulebb-rust:${{ env.RELEASE_VERSION }}-${{ matrix.variant }}"
          --architecture ${{ matrix.architecture }}
          --security-dir "${{ runner.temp }}/emulebb-rust-out/evidence/${{ matrix.variant }}-${{ matrix.architecture }}"
          --control-rust-repo "${{ github.workspace }}"
      - name: Retain bounded native image proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-image-native-proof-${{ matrix.variant }}-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/evidence/${{ matrix.variant }}-${{ matrix.architecture }}/*.json
            ${{ runner.temp }}/emulebb-rust-out/evidence/${{ matrix.variant }}-${{ matrix.architecture }}/*.txt
            ${{ runner.temp }}/emulebb-rust-out/evidence/${{ matrix.variant }}-${{ matrix.architecture }}/*-security-SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Retain image validation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-image-validation-logs-${{ matrix.variant }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/emulebb-rust-out/evidence/${{ matrix.variant }}-${{ matrix.architecture }}/*.log
          if-no-files-found: warn
          retention-days: 30

  assemble-candidate:
    name: Assemble verified application, native and container candidate
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          needs.native-package-smoke.result == 'success' &&
          needs.musl-package.result == 'success' &&
          needs.image-native-validation.result == 'success' &&
          (needs.android-package.result == 'success' ||
           (inputs.channel != 'nightly' && needs.android-package.result == 'skipped')) &&
          (needs.android-apk-package.result == 'success' ||
           (inputs.channel != 'nightly' && needs.android-apk-package.result == 'skipped')) &&
          (needs.android-apk-qualification.result == 'success' ||
           (inputs.channel != 'nightly' && needs.android-apk-qualification.result == 'skipped')) }}
    needs: [prepare, native-package-smoke, musl-package, image-native-validation, android-package, android-apk-package, android-apk-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      candidate_sha256: ${{ steps.candidate.outputs.candidate_sha256 }}
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
      EMULEBB_RUST_REPO: ${{ github.workspace }}/emulebb-rust
      EMULEBB_TOOLING_REPO: ${{ github.workspace }}/emulebb-tooling
      EMULEBB_TESTS_REPO: ${{ github.workspace }}/emulebb-apk-tests
      MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
      PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      EMULEBB_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.apk_version_code }}
      EMULEBB_SOURCE_REVISION: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Checkout trusted release-control source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: emulebb-rust
          persist-credentials: false
      - name: Checkout pinned candidate assembler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build
          ref: ${{ env.EMULEBB_RELEASE_VALIDATOR_REF }}
          path: emulebb-build
          persist-credentials: false
      - name: Checkout pinned image evidence reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build-tests
          ref: ${{ env.EMULEBB_BUILD_TESTS_REF }}
          path: emulebb-build-tests
          persist-credentials: false
      - name: Checkout pinned release documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-tooling
          ref: ${{ env.EMULEBB_TOOLING_REF }}
          path: emulebb-tooling
          persist-credentials: false
      - name: Checkout independently pinned APK evidence reader
        if: ${{ inputs.channel == 'nightly' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build-tests
          ref: ${{ env.EMULEBB_APK_BUILD_TESTS_REF }}
          path: emulebb-apk-tests
          persist-credentials: false
      - *apk-checkout-miniupnp
      - *apk-checkout-pcp
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install pinned workspace CLI dependencies
        run: python -m pip install click==8.4.1 pydantic==2.14.3
      - name: Download native payloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: emulebb-rust-native-payload-*
          merge-multiple: true
          path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
      - name: Download static musl payloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: emulebb-rust-musl-payload-*
          merge-multiple: true
          path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
      - name: Download experimental Android developer payloads
        if: ${{ inputs.channel == 'nightly' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: emulebb-rust-android-developer-payload-*
          merge-multiple: true
          path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
      - name: Download the single signed Android application
        if: ${{ inputs.channel == 'nightly' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emulebb-rust-android-apk-payload
          path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
      - name: Download four separate Android runtime proofs
        if: ${{ inputs.channel == 'nightly' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: emulebb-rust-android-apk-proof-*
          merge-multiple: false
          path: ${{ runner.temp }}/emulebb-rust-out/apk-evidence
      - name: Download every selected native package lifecycle proof
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: emulebb-rust-package-smoke-*
          merge-multiple: true
          path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
      - name: Download both OCI archives separately from public assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: emulebb-rust-image-archive-*
          merge-multiple: true
          path: ${{ runner.temp }}/emulebb-rust-out/artifacts
      - name: Download both native Ubuntu proofs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: emulebb-rust-image-native-proof-ubuntu-*
          merge-multiple: true
          path: ${{ runner.temp }}/emulebb-rust-out/image-evidence/ubuntu
      - name: Download both native Alpine proofs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: emulebb-rust-image-native-proof-alpine-*
          merge-multiple: true
          path: ${{ runner.temp }}/emulebb-rust-out/image-evidence/alpine
      - name: Bind both native CPU proofs to each exact OCI archive
        working-directory: emulebb-build
        shell: bash
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          RELEASE_DIR: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          for variant in ubuntu alpine; do
            python -B -m emule_workspace assemble-emulebb-rust-image-evidence-ci \
              --archive "$EMULEBB_WORKSPACE_OUTPUT_ROOT/artifacts/emulebb-rust-v$RELEASE_VERSION-$variant-multiarch.oci.tar" \
              --evidence-dir "$EMULEBB_WORKSPACE_OUTPUT_ROOT/image-evidence/$variant" \
              --release-dir "$RELEASE_DIR" --release-version "$RELEASE_VERSION" \
              --source-sha "$EMULEBB_SOURCE_REVISION" \
              --harness-repo "$GITHUB_WORKSPACE/emulebb-build-tests" --harness-sha "$EMULEBB_BUILD_TESTS_REF" \
              --control-rust-repo "$GITHUB_WORKSPACE/emulebb-rust"
          done
      - name: Download preflighted release documents
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emulebb-rust-release-documents
          path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
      - name: Bind four API proofs to the same signed APK and trusted authorities
        if: ${{ inputs.channel == 'nightly' }}
        working-directory: emulebb-build
        env:
          APK_MANIFEST_SHA256: ${{ needs.android-apk-package.outputs.manifest_sha256 }}
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
          RELEASE_DIR: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
        run: >-
          python -B -m emule_workspace assemble-rust-android-apk-evidence-ci
          --apk-payload "$RELEASE_DIR"
          --apk-manifest-name "emulebb-rust-v$RELEASE_VERSION-android-universal.apk.manifest.json"
          --apk-manifest-sha256 "$APK_MANIFEST_SHA256" --apk-source-sha "$EMULEBB_SOURCE_REVISION"
          --expected-cert-sha256 "$EMULEBB_ANDROID_SIGNER_SHA256" --apk-version-code "$EMULEBB_ANDROID_VERSION_CODE"
          --release-version "$RELEASE_VERSION" --apk-build-ref "$EMULEBB_APK_BUILD_REF"
          --apk-harness-ref "$EMULEBB_APK_BUILD_TESTS_REF"
          --evidence-dir "$EMULEBB_WORKSPACE_OUTPUT_ROOT/apk-evidence" --release-dir "$RELEASE_DIR"
      - name: Verify all payloads and checksum the final public evidence set
        working-directory: emulebb-build
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          RELEASE_DIR: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
        run: >-
          python -B -m emule_workspace assemble-emulebb-rust-release-ci
          --release-version "$RELEASE_VERSION" --assets-dir "$RELEASE_DIR" --platform-profile "$RELEASE_PLATFORM_PROFILE"
      - name: Verify exact source pins, native proofs and candidate bytes
        id: candidate
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          RELEASE_DIR: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
        run: >-
          python -B emulebb-rust/tools/release_publish.py candidate-manifest
          --release-dir "$RELEASE_DIR"
          --output "$RELEASE_DIR/emulebb-rust-v$RELEASE_VERSION-candidate-manifest.json"
          --archives-dir "$EMULEBB_WORKSPACE_OUTPUT_ROOT/artifacts"
          --build-repo emulebb-build --apk-harness-repo emulebb-apk-tests --harness-repo emulebb-build-tests
          --github-output "$GITHUB_OUTPUT"
      - name: Retain the exact public release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-release-candidate
          path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*
          if-no-files-found: error
          retention-days: 30

  publish-image:
    name: Publish both verified container variants
    needs: [prepare, image-candidate, assemble-candidate]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: rust-image-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      candidate_sha256: ${{ steps.published.outputs.candidate_sha256 }}
      ubuntu_digest: ${{ steps.published.outputs.ubuntu_digest }}
      alpine_digest: ${{ steps.published.outputs.alpine_digest }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      EMULEBB_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.apk_version_code }}
      EMULEBB_SOURCE_REVISION: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Checkout trusted publication helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: emulebb-rust
          persist-credentials: false
      - name: Checkout pinned candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build
          ref: ${{ env.EMULEBB_RELEASE_VALIDATOR_REF }}
          path: emulebb-build
          persist-credentials: false
      - name: Checkout pinned OCI graph reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build-tests
          ref: ${{ env.EMULEBB_BUILD_TESTS_REF }}
          path: emulebb-build-tests
          persist-credentials: false
      - name: Checkout independently pinned APK evidence reader
        if: ${{ inputs.channel == 'nightly' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build-tests
          ref: ${{ env.EMULEBB_APK_BUILD_TESTS_REF }}
          path: emulebb-apk-tests
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install pinned workspace CLI dependencies
        run: python -m pip install click==8.4.1 pydantic==2.14.3
      - name: Download the final public candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emulebb-rust-release-candidate
          path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
      - name: Download both exact OCI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: emulebb-rust-image-archive-*
          merge-multiple: true
          path: ${{ runner.temp }}/emulebb-rust-out/artifacts
      - name: Install pinned registry client
        uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: v0.11.6
      - name: Authenticate publication to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify candidate bytes, preflight immutable tags and publish both variants
        id: published
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          RELEASE_DIR: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSEMBLED_CANDIDATE_SHA: ${{ needs.assemble-candidate.outputs.candidate_sha256 }}
        run: >-
          python -B emulebb-rust/tools/release_publish.py publish-images
          --release-dir "$RELEASE_DIR" --archives-dir "$EMULEBB_WORKSPACE_OUTPUT_ROOT/artifacts"
          --build-repo emulebb-build --apk-harness-repo emulebb-apk-tests --harness-repo emulebb-build-tests
          --assembled-candidate-sha256 "$ASSEMBLED_CANDIDATE_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Attest the published Ubuntu digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/emulebb/emulebb-rust
          subject-digest: ${{ steps.published.outputs.ubuntu_digest }}
          push-to-registry: true
      - name: Attest the published Alpine digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/emulebb/emulebb-rust
          subject-digest: ${{ steps.published.outputs.alpine_digest }}
          push-to-registry: true

  publish-native:
    name: Publish verified native release assets
    needs: [prepare, assemble-candidate, publish-image]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: rust-native-release-${{ needs.prepare.outputs.release_version }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      EMULEBB_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.apk_version_code }}
      EMULEBB_SOURCE_REVISION: ${{ needs.prepare.outputs.source_sha }}
      VERIFIED_CANDIDATE_SHA: ${{ needs.publish-image.outputs.candidate_sha256 }}
    steps:
      - name: Checkout trusted publication helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: emulebb-rust
          persist-credentials: false
      - name: Checkout pinned public candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build
          ref: ${{ env.EMULEBB_RELEASE_VALIDATOR_REF }}
          path: emulebb-build
          persist-credentials: false
      - name: Checkout independently pinned APK evidence reader
        if: ${{ inputs.channel == 'nightly' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build-tests
          ref: ${{ env.EMULEBB_APK_BUILD_TESTS_REF }}
          path: emulebb-apk-tests
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install pinned workspace CLI dependencies
        run: python -m pip install click==8.4.1 pydantic==2.14.3
      - name: Download the exact image-publisher-verified public candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: emulebb-rust-release-candidate
          path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
      - name: Recheck source eligibility and existing draft bytes
        env:
          RELEASE_DIR: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -B emulebb-rust/tools/release_publish.py release-assets \
            --release-dir "$RELEASE_DIR" --build-repo emulebb-build --apk-harness-repo emulebb-apk-tests \
            --verified-candidate-sha256 "$VERIFIED_CANDIDATE_SHA" --phase before-upload
      - name: Attest the exact native release candidate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*
      - name: Upload immutable assets to a draft prerelease
        id: draft-release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: rust-v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ needs.prepare.outputs.source_sha }}
          draft: true
          prerelease: true
          make_latest: false
          overwrite_files: false
          body_path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/RELEASE-${{ env.RELEASE_VERSION }}-NOTES.md
          files: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*
      - name: Verify every uploaded asset before finalizing the draft
        env:
          RELEASE_DIR: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
        run: |
          set -euo pipefail
          python -B emulebb-rust/tools/release_publish.py release-assets \
            --release-dir "$RELEASE_DIR" --build-repo emulebb-build --apk-harness-repo emulebb-apk-tests \
            --verified-candidate-sha256 "$VERIFIED_CANDIDATE_SHA" --phase after-upload --release-id "$RELEASE_ID"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false

  publish-nightly-channel:
    name: Advance both verified nightly image channels
    needs: [prepare, publish-image, publish-native]
    if: inputs.channel == 'nightly' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: rust-image-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      EMULEBB_SOURCE_REVISION: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Checkout trusted channel control helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install pinned channel registry client
        uses: regclient/actions/regctl-installer@dd58ad94f76adb73d8ac1bf75ed25f01545d5b32 # v0.2.0
        with:
          release: v0.11.6
      - name: Authenticate nightly channel publication
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck source and immutable versions, then promote only bound digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UBUNTU_DIGEST: ${{ needs.publish-image.outputs.ubuntu_digest }}
          ALPINE_DIGEST: ${{ needs.publish-image.outputs.alpine_digest }}
        run: python -B tools/release_publish.py promote-nightly

  cleanup-nightlies:
    name: Retain the newest 14 nightlies
    if: ${{ always() && inputs.publish && inputs.channel == 'nightly' && needs.publish-native.result == 'success' && needs.publish-nightly-channel.result == 'success' }}
    needs: [publish-native, publish-nightly-channel]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted retention helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: emulebb-rust
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Prune superseded nightly releases
        continue-on-error: true
        working-directory: emulebb-rust
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/nightly_release.py prune --keep 14
