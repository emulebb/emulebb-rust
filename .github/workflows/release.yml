name: Release

# Manual runs retain candidate artifacts. Approved tags and the reusable nightly
# caller may publish the verified result.
on:
  push:
    tags: ["rust-v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Rust ref to package (defaults to the selected branch)"
        required: false
  workflow_call:
    inputs:
      release_version:
        description: "Distribution version assigned to the packages and release"
        required: true
        type: string
      source_ref:
        description: "Immutable Rust commit to package"
        required: true
        type: string
      previous_ref:
        description: "Previous nightly tag used to generate release notes"
        required: false
        type: string
        default: ""
      channel:
        description: "Release channel (candidate or nightly)"
        required: false
        type: string
        default: candidate
      publish:
        description: "Publish verified GitHub and GHCR assets"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.release_version || '0.1.0-beta.2' }}
  MINIUPNP_REF: 4e7a10948004ca2085ac8103e14fc77edb898b4c
  PCPNATPMP_REF: a6e787f837e507336a8774522c33b54264ef4a4b

jobs:
  verify-ci:
    name: Require green source CI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.event.inputs.ref || github.ref }}
      - name: Resolve immutable source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify required checks on the exact source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/nightly_release.py verify-ci --sha "${{ steps.source.outputs.sha }}"

  native-package:
    name: ${{ matrix.os }}-${{ matrix.arch }} package
    needs: verify-ci
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows, arch: x64, runner: windows-latest}
          - {os: windows, arch: ARM64, runner: windows-11-arm}
          - {os: linux, arch: x64, runner: ubuntu-24.04}
          - {os: linux, arch: ARM64, runner: ubuntu-24.04-arm}
          - {os: macos, arch: x64, runner: macos-15-intel}
          - {os: macos, arch: ARM64, runner: macos-15}
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
      EMULEBB_RUST_REPO: ${{ github.workspace }}
      EMULEBB_TOOLING_REPO: ${{ github.workspace }}/.ci/emulebb-tooling
      MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
      PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.event.inputs.ref || github.ref }}
      - name: Checkout native MiniUPnP source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-miniupnp
          ref: ${{ env.MINIUPNP_REF }}
          path: .ci/emulebb-miniupnp
      - name: Checkout native libpcpnatpmp source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-libpcpnatpmp
          ref: ${{ env.PCPNATPMP_REF }}
          path: .ci/emulebb-libpcpnatpmp
      - name: Checkout pinned workspace packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build
          ref: 1a9ad5b19b29b24470547c0514844d192b83079c
          path: .ci/emulebb-build
      - name: Checkout pinned release documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-tooling
          ref: adb49ac93ac1c0b59319c7fd6c004faeb876720c
          path: .ci/emulebb-tooling
      - name: Checkout pinned package smoke harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build-tests
          ref: 5ef34ae3eff53e5686b6eec0c95bced4dda076a9
          path: .ci/emulebb-build-tests
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned workspace CLI dependencies
        run: python -m pip install click==8.4.1 pydantic==2.13.4
      - name: Install pinned rendered WebUI smoke dependency
        if: matrix.os == 'windows' && matrix.arch == 'x64'
        run: python -m pip install playwright==1.59.0 && python -m playwright install chromium
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libfontconfig1-dev
      - name: Install verified AppImage builder
        if: matrix.os == 'linux'
        shell: bash
        run: |
          if [[ '${{ matrix.arch }}' == 'ARM64' ]]; then
            tool_arch=aarch64
            expected=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
          else
            tool_arch=x86_64
            expected=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          fi
          tool="$RUNNER_TEMP/appimagetool-${tool_arch}.AppImage"
          curl --fail --location --silent --show-error \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${tool_arch}.AppImage" \
            --output "$tool"
          echo "$expected  $tool" | sha256sum --check
          chmod 755 "$tool"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "ARCH=$tool_arch" >> "$GITHUB_ENV"
      - name: Assert release build excludes test-only features
        run: python tools/check_rust_client_policy.py
      - name: Prepare inherited build output directory
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
        run: python -c "from pathlib import Path; import os; Path(os.environ['CARGO_TARGET_DIR']).mkdir(parents=True, exist_ok=True)"
      - name: Build and package native release asset
        working-directory: .ci/emulebb-build
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
          RUSTUP_TOOLCHAIN: "1.98.1"
        run: python -m emule_workspace package-emulebb-rust-ci --release-version ${{ env.RELEASE_VERSION }} --target-os ${{ matrix.os }} --platform ${{ matrix.arch }}
      - name: Smoke native package and embedded WebUI
        run: python .ci/emulebb-build-tests/scripts/smoke-rust-release-package.py --release-dir "${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}" --release-version ${{ env.RELEASE_VERSION }} --target-os ${{ matrix.os }} --platform ${{ matrix.arch }}
      - name: Render native package WebUI and prove stale-key recovery
        if: matrix.os == 'windows' && matrix.arch == 'x64'
        run: python .ci/emulebb-build-tests/scripts/smoke-rust-release-package.py --release-dir "${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}" --release-version ${{ env.RELEASE_VERSION }} --target-os ${{ matrix.os }} --platform ${{ matrix.arch }} --render-webui
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulebb-rust-build-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/emulebb-rust-out/logs/builds/**/*.log
          if-no-files-found: warn
          retention-days: 30
      - name: Retain package and provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulebb-rust-package-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*.zip
            ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*.deb
            ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*.AppImage
            ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*.dmg
            ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*.json
          if-no-files-found: warn
          retention-days: 30

  image-candidate:
    name: Build multiarch image candidate
    needs: native-package
    runs-on: ubuntu-24.04
    env:
      EMULEBB_RUST_REPO: ${{ github.workspace }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.event.inputs.ref || github.ref }}
      - name: Checkout pinned workspace packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build
          ref: 1a9ad5b19b29b24470547c0514844d192b83079c
          path: .ci/emulebb-build
      - name: Checkout pinned image smoke harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build-tests
          ref: 5ef34ae3eff53e5686b6eec0c95bced4dda076a9
          path: .ci/emulebb-build-tests
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned workspace CLI dependencies
        run: python -m pip install click==8.4.1 pydantic==2.13.4
      - name: Set up Docker with multi-platform image store
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5.5.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Download all native assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: emulebb-rust-package-*
          merge-multiple: true
          path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
      - name: Build OCI archive without publishing
        working-directory: .ci/emulebb-build
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
        run: python -m emule_workspace package-emulebb-rust-image-ci --release-version ${{ env.RELEASE_VERSION }} --assets-dir "${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}"
      - name: Smoke first-run LinuxServer image
        run: python .ci/emulebb-build-tests/scripts/smoke-rust-container.py --archive "${{ runner.temp }}/emulebb-rust-out/artifacts/emulebb-rust-v${{ env.RELEASE_VERSION }}-multiarch.oci.tar" --image "ghcr.io/emulebb/emulebb-rust:${{ env.RELEASE_VERSION }}"
      - name: Retain image candidate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulebb-rust-image-candidate
          path: ${{ runner.temp }}/emulebb-rust-out/artifacts/emulebb-rust-v${{ env.RELEASE_VERSION }}-multiarch.oci.tar
          if-no-files-found: error
          retention-days: 30

  publish-image:
    name: Publish verified GHCR image
    if: ${{ startsWith(github.ref, 'refs/tags/rust-v') || inputs.publish }}
    needs: image-candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require the approved beta tag
        if: ${{ startsWith(github.ref, 'refs/tags/rust-v') }}
        shell: bash
        run: test "$GITHUB_REF_NAME" = "rust-v${RELEASE_VERSION}"
      - name: Download smoke-tested image candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: emulebb-rust-image-candidate
          path: ${{ runner.temp }}/emulebb-rust-out/artifacts
      - name: Install Cosign for registry-client verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install pinned registry client
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: v0.11.6
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Import the smoke-tested immutable image
        shell: bash
        env:
          OCI_ARCHIVE: ${{ runner.temp }}/emulebb-rust-out/artifacts/emulebb-rust-v${{ env.RELEASE_VERSION }}-multiarch.oci.tar
          VERSIONED_IMAGE: ghcr.io/emulebb/emulebb-rust:${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          regctl image import "$VERSIONED_IMAGE" "$OCI_ARCHIVE"
          regctl image digest "$VERSIONED_IMAGE"
      - name: Point the floating nightly tag at the immutable image
        if: ${{ inputs.channel == 'nightly' }}
        shell: bash
        env:
          VERSIONED_IMAGE: ghcr.io/emulebb/emulebb-rust:${{ env.RELEASE_VERSION }}
          CHANNEL_IMAGE: ghcr.io/emulebb/emulebb-rust:nightly
        run: |
          set -euo pipefail
          regctl image copy "$VERSIONED_IMAGE" "$CHANNEL_IMAGE"
          test "$(regctl image digest "$VERSIONED_IMAGE")" = "$(regctl image digest "$CHANNEL_IMAGE")"

  publish-native:
    name: Publish verified native assets
    if: ${{ startsWith(github.ref, 'refs/tags/rust-v') || inputs.publish }}
    needs: publish-image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Require the approved beta tag
        if: ${{ startsWith(github.ref, 'refs/tags/rust-v') }}
        shell: bash
        run: test "$GITHUB_REF_NAME" = "rust-v${RELEASE_VERSION}"
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
          path: emulebb-rust
      - name: Checkout pinned workspace packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-build
          ref: 1a9ad5b19b29b24470547c0514844d192b83079c
          path: emulebb-build
      - name: Checkout pinned release documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emulebb/emulebb-tooling
          ref: adb49ac93ac1c0b59319c7fd6c004faeb876720c
          path: emulebb-tooling
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned workspace CLI dependencies
        run: python -m pip install click==8.4.1 pydantic==2.13.4
      - name: Download all native assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: emulebb-rust-package-*
          merge-multiple: true
          path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}
      - name: Verify complete set and write SHA256SUMS
        working-directory: emulebb-build
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
        run: python -m emule_workspace assemble-emulebb-rust-release-ci --release-version ${{ env.RELEASE_VERSION }} --assets-dir "${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}"
      - name: Add versioned release documentation
        if: ${{ inputs.channel != 'nightly' }}
        shell: bash
        run: |
          release_dir="${{ runner.temp }}/emulebb-rust-out/release/rust-v${RELEASE_VERSION}"
          cp "emulebb-tooling/docs/products/emulebb-rust/RELEASE-${RELEASE_VERSION}-NOTES.md" "$release_dir/"
          cp "emulebb-tooling/docs/products/emulebb-rust/RELEASE-${RELEASE_VERSION}-CHANGELOG.md" "$release_dir/"
      - name: Generate commit-based nightly notes
        if: ${{ inputs.channel == 'nightly' }}
        working-directory: emulebb-rust
        run: python tools/nightly_release.py notes --version "${RELEASE_VERSION}" --previous-ref "${{ inputs.previous_ref }}" --output "${{ runner.temp }}/nightly-release-notes.md"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.channel == 'nightly' && format('rust-v{0}', inputs.release_version) || github.ref_name }}
          target_commitish: ${{ inputs.source_ref || github.sha }}
          prerelease: true
          make_latest: false
          body_path: ${{ inputs.channel == 'nightly' && format('{0}/nightly-release-notes.md', runner.temp) || 'emulebb-tooling/docs/products/emulebb-rust/RELEASE-0.1.0-beta.2-NOTES.md' }}
          files: ${{ runner.temp }}/emulebb-rust-out/release/rust-v${{ env.RELEASE_VERSION }}/*
          fail_on_unmatched_files: true
      - name: Keep the newest 14 nightlies
        if: ${{ inputs.channel == 'nightly' }}
        working-directory: emulebb-rust
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/nightly_release.py prune --keep 14
