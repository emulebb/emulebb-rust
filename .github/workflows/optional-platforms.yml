name: Optional platform CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: optional-platform-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  EMULEBB_BUILD_REF: 3b9ddf42466b07f852f798f6967ca782484056a4
  EMULEBB_ANDROID_BUILD_REF: 3b9ddf42466b07f852f798f6967ca782484056a4
  EMULEBB_BUILD_TESTS_REF: 7c680ed68e478c2f22c56c65f21f12c3790d3826
  EMULEBB_TOOLING_REF: 8125e1a42dbac792eae6e35bbc427d6b885d599f
  # Pin the native NAT sources linked by the sys crates.
  MINIUPNP_REF: 4e7a10948004ca2085ac8103e14fc77edb898b4c
  PCPNATPMP_REF: a6e787f837e507336a8774522c33b54264ef4a4b

jobs:
  change-scope:
    name: Trusted change scope + documentation validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      docs_validated: ${{ steps.classify.outputs.docs_validated }}
      tested_sha: ${{ steps.classify.outputs.tested_sha }}
      classifier_blob: ${{ steps.classify.outputs.classifier_blob }}
    steps:
      - name: Checkout immutable tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Classify with the immutable trusted base
        id: classify
        shell: bash
        run: |
          python -I -B - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          repo = Path(os.environ["GITHUB_WORKSPACE"])
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          name = os.environ["GITHUB_EVENT_NAME"]
          base = ""
          if name == "push":
              base = event.get("before", "")
          elif name == "pull_request":
              base = event.get("pull_request", {}).get("base", {}).get("sha", "")
          control = Path(os.environ["RUNNER_TEMP"]) / "emulebb-ci-scope"
          control.mkdir(parents=True, exist_ok=True)
          receipt = control / "classification.json"
          blob = None
          if name in {"push", "pull_request"} and isinstance(base, str) and re.fullmatch(r"[0-9a-f]{40}", base) and set(base) != {"0"}:
              result = subprocess.run(["git", "-C", str(repo), "ls-tree", base, "--", "tools/ci_change_scope.py"], capture_output=True, timeout=30)
              match = re.fullmatch(rb"100644 blob ([0-9a-f]{40})\ttools/ci_change_scope.py\n", result.stdout) if result.returncode == 0 else None
              if match:
                  blob = match.group(1).decode("ascii")
          if blob is None:
              # WHY: first deployment and unknown events require the complete matrix.
              # Never fall back to executing the classifier from the proposed head.
              value = {"schema": "emulebb.ci-change-scope/1", "repository": os.environ["GITHUB_REPOSITORY"],
                       "event": name, "baseSha": base, "testedSha": os.environ["GITHUB_SHA"],
                       "headSha": event.get("pull_request", {}).get("head", {}).get("sha") if name == "pull_request" else os.environ["GITHUB_SHA"],
                       "classifierBlob": None, "scope": "full", "docsValidated": False,
                       "reason": "trusted-base-unavailable-or-forced-full-event", "changes": []}
              receipt.write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                  output.write("scope=full\ndocs_validated=false\nclassifier_blob=\n")
                  output.write("tested_sha=" + os.environ["GITHUB_SHA"] + "\n")
          else:
              source = subprocess.run(["git", "-C", str(repo), "cat-file", "blob", blob], check=True,
                                      capture_output=True, timeout=30).stdout
              trusted = control / "trusted-classifier.py"
              trusted.write_bytes(source)
              subprocess.run([sys.executable, "-I", "-B", str(trusted), "--repo", str(repo),
                              "--event-path", os.environ["GITHUB_EVENT_PATH"], "--event-name", name,
                              "--repository", os.environ["GITHUB_REPOSITORY"], "--tested-sha", os.environ["GITHUB_SHA"],
                              "--base-sha", base, "--github-output", os.environ["GITHUB_OUTPUT"],
                              "--receipt", str(receipt)], check=True, timeout=120)
          PY
      - name: Retain source-bound scope receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: change-scope-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/emulebb-ci-scope/classification.json
          if-no-files-found: error
          retention-days: 14

  single-active-pr:
    name: Optional platform PR coordination
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Enforce one human pull request per author
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            if (pullRequest.user.type === "Bot") {
              core.info(`Bot-authored pull request #${pullRequest.number} is exempt.`);
              return;
            }

            const exceptionLabel = "parallel-approved";
            const hasException = (candidate) =>
              candidate.labels.some((label) => label.name === exceptionLabel);
            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              base: pullRequest.base.ref,
              per_page: 100,
            });
            const parallelPullRequests = openPullRequests.filter(
              (candidate) =>
                candidate.number !== pullRequest.number &&
                candidate.user.login === pullRequest.user.login &&
                candidate.user.type !== "Bot",
            );

            if (parallelPullRequests.length === 0) {
              core.info(`Pull request #${pullRequest.number} is the author's only open pull request.`);
              return;
            }

            const unapprovedPullRequests = [pullRequest, ...parallelPullRequests].filter(
              (candidate) => !hasException(candidate),
            );
            if (unapprovedPullRequests.length === 0) {
              core.notice(
                `Parallel work is approved on every open pull request by ${pullRequest.user.login}.`,
              );
              return;
            }

            const parallelSummary = parallelPullRequests
              .map((candidate) => `#${candidate.number} (${candidate.html_url})`)
              .join(", ");
            core.setFailed(
              `@${pullRequest.user.login} already has open pull request(s): ${parallelSummary}. ` +
                `Close or merge them before continuing, or apply '${exceptionLabel}' to every ` +
                "affected pull request after recording the maintainer-approved reason on each one.",
            );

      - name: Skip pull request policy outside pull requests
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "The single-active-PR policy applies only to pull requests."

  workflow-lint:
    name: GitHub Actions workflow lint
    needs: single-active-pr
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout emulebb-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Validate GitHub Actions workflows
        env:
          EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
        run: python tools/rust_quality_gate.py workflow-lint

      - name: Retain CI diagnostics and build inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/reports/rust-quality-gate/
            ${{ runner.temp }}/emulebb-rust-out/reports/ci-environment/
            ${{ runner.temp }}/emulebb-rust-out/reports/webui-stage/
          if-no-files-found: warn
          retention-days: 14

  build-macos:
    name: build+test (${{ matrix.runner }})
    needs: [single-active-pr, workflow-lint, change-scope]
    if: ${{ needs.change-scope.outputs.scope == 'full' }}
    runs-on: ${{ matrix.runner }}
    # WHY: the cold Intel macOS build reached the old deadline while tests
    # were still passing; retain the full suite with a bounded larger budget.
    timeout-minutes: ${{ matrix.runner == 'macos-15-intel' && 120 || 45 }}
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    steps:
      - name: Checkout emulebb-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout emulebb-miniupnp (native C source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-miniupnp
          ref: ${{ env.MINIUPNP_REF }}
          path: .ci/emulebb-miniupnp

      - name: Checkout emulebb-libpcpnatpmp (native C source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-libpcpnatpmp
          ref: ${{ env.PCPNATPMP_REF }}
          path: .ci/emulebb-libpcpnatpmp

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global npm@11.20.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: false
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target

      - name: Rust build/test gate
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
          MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
          PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
        run: python tools/rust_quality_gate.py ci-test

      - name: Retain tested beta build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulebb-rust-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          overwrite: true
          path: |
            ${{ runner.temp }}/emulebb-rust-out/tools/emulebb-rust/bin/
            !${{ runner.temp }}/emulebb-rust-out/tools/emulebb-rust/bin/*.pdb
          if-no-files-found: error
          retention-days: 14

      - name: Retain CI diagnostics and build inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/reports/rust-quality-gate/
            ${{ runner.temp }}/emulebb-rust-out/reports/ci-environment/
            ${{ runner.temp }}/emulebb-rust-out/reports/webui-stage/
          if-no-files-found: warn
          retention-days: 14

  build-android:
    name: Android compile+ELF (${{ matrix.abi }})
    needs: [single-active-pr, workflow-lint, change-scope]
    if: ${{ needs.change-scope.outputs.scope == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      EMULEBB_WORKSPACE_ROOT: ${{ github.workspace }}
      EMULEBB_RUST_REPO: ${{ github.workspace }}
      EMULEBB_TOOLING_REPO: ${{ github.workspace }}/.ci/emulebb-tooling
      MINIUPNP_ROOT: ${{ github.workspace }}/.ci/emulebb-miniupnp
      PCPNATPMP_ROOT: ${{ github.workspace }}/.ci/emulebb-libpcpnatpmp
    steps:
      - name: Checkout emulebb-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout pinned Android orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-build
          ref: ${{ env.EMULEBB_ANDROID_BUILD_REF }}
          path: .ci/emulebb-build
      - name: Checkout pinned product documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-tooling
          ref: ${{ env.EMULEBB_TOOLING_REF }}
          path: .ci/emulebb-tooling
      - name: Checkout pinned MiniUPnP source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-miniupnp
          ref: ${{ env.MINIUPNP_REF }}
          path: .ci/emulebb-miniupnp
      - name: Checkout pinned PCP/NAT-PMP source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: emulebb/emulebb-libpcpnatpmp
          ref: ${{ env.PCPNATPMP_REF }}
          path: .ci/emulebb-libpcpnatpmp
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install pinned workspace CLI dependencies
        run: python -m pip install click==8.4.1 pydantic==2.14.3
      - name: Set up pinned Docker
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.6.1
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - name: Set up pinned Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.35.0
          driver: docker
          use: false
      - name: Run the local Android compile and ELF gate
        working-directory: .ci/emulebb-build
        env:
          EMULEBB_WORKSPACE_OUTPUT_ROOT: ${{ runner.temp }}/emulebb-rust-out
          CARGO_TARGET_DIR: ${{ runner.temp }}/emulebb-rust-out/builds/rust/target
        run: |
          mkdir -p "$CARGO_TARGET_DIR"
          python -B -m emule_workspace validate-rust-android-ci --abi ${{ matrix.abi }}
      - name: Retain Android compilation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-evidence-android-${{ matrix.abi }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/emulebb-rust-out/reports/android-toolchain/
            ${{ runner.temp }}/emulebb-rust-out/reports/rust-android/
          if-no-files-found: warn
          retention-days: 14

  optional-platform-ci:
    name: Optional Platform CI
    if: ${{ always() }}
    needs: [change-scope, single-active-pr, workflow-lint, build-macos, build-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report independent platform outcomes
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          SCOPE: ${{ needs.change-scope.outputs.scope }}
          DOCS_VALIDATED: ${{ needs.change-scope.outputs.docs_validated }}
          CLASSIFIED_TESTED_SHA: ${{ needs.change-scope.outputs.tested_sha }}
          CLASSIFIER_BLOB: ${{ needs.change-scope.outputs.classifier_blob }}
          EXPECTED_TESTED_SHA: ${{ github.sha }}
          COORDINATION_RESULT: ${{ needs.single-active-pr.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          ANDROID_RESULT: ${{ needs.build-android.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          test -n "$EXPECTED_TESTED_SHA"
          test "$CLASSIFIED_TESTED_SHA" = "$EXPECTED_TESTED_SHA"
          case "$SCOPE" in
            full) test "$DOCS_VALIDATED" = false; expected=success ;;
            docs)
              test "$DOCS_VALIDATED" = true
              [[ "$CLASSIFIER_BLOB" =~ ^[0-9a-f]{40}$ ]]
              expected=skipped
              ;;
            *) exit 1 ;;
          esac
          for result in "$COORDINATION_RESULT" "$WORKFLOW_LINT_RESULT"; do
            test "$result" = success
          done
          for result in "$MACOS_RESULT" "$ANDROID_RESULT"; do
            test "$result" = "$expected"
          done
