# cargo-deny configuration for emulebb-rust.
#
# Advisories, licenses, and sources are hard CI gates. Bans remain advisory
# while duplicate-version cleanup is handled incrementally.

[advisories]
# Deny known vulnerabilities and yanked crates; flag all unmaintained advisories.
# (cargo-deny's `unmaintained` takes all/workspace/transitive/none, not a severity.)
yanked = "deny"
unmaintained = "all"
ignore = [
    # RUSTSEC-2026-0543 reports Chrono's maintenance status for every version.
    # Remove this exception after the migration to time in RUST-REF-025 (#350).
    "RUSTSEC-2026-0543",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
# GPL-2.0-compatible and other approved dependency licenses.
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "GPL-2.0-only",
  "Unlicense",
]
