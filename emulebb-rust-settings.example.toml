[rest]
bindAddr = "127.0.0.1:4711"
# Replace this placeholder before startup with at least 32 random printable
# ASCII characters. Keep this file private to the account running the daemon.
apiKey = "REPLACE_WITH_32_OR_MORE_RANDOM_CHARACTERS"
